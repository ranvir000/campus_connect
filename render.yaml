services:
  # ----------------------------------------------------
  # 1. Backend Web Service (FastAPI + Python)
  # ----------------------------------------------------
  - type: web
    name: campusconnect-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --app-dir .
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: campusconnect
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URLS
        sync: false

  # ----------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # ----------------------------------------------------
  - type: web
    name: campusconnect-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      # Proxy /api requests to the backend (preserves same-origin cookies)
      - type: rewrite
        source: /api/*
        destination: https://campus-connect-pt36.onrender.com/api/*
      # Single-Page Application client-side routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
